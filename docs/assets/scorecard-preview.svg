<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="675" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">labcheck reproducibility scorecard preview</title>
  <desc id="desc">A preview of a labcheck report showing an overall score, top risks, category scores, and first fixes.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5efe2"/>
      <stop offset="55%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#e8f3ef"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#fffdf8"/>
      <stop offset="100%" stop-color="#f7f0e6"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="24" stdDeviation="22" flood-color="#17202a" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <circle cx="1040" cy="72" r="210" fill="#0f766e" opacity="0.09"/>
  <circle cx="140" cy="620" r="260" fill="#a16207" opacity="0.08"/>

  <rect x="70" y="54" width="1060" height="568" rx="34" fill="url(#panel)" stroke="#d8cdb9" filter="url(#shadow)"/>
  <text x="112" y="116" fill="#0f766e" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700" letter-spacing="4">LABCHECK SCORECARD</text>
  <text x="112" y="165" fill="#17202a" font-family="Georgia, 'Times New Roman', serif" font-size="44" font-weight="700">Can this repo be rerun by a stranger?</text>
  <text x="112" y="202" fill="#5b6470" font-family="Arial, sans-serif" font-size="20">No API keys. No backend bill. Deterministic reproducibility triage for notebooks and ML repos.</text>

  <g transform="translate(112 250)">
    <rect width="250" height="244" rx="24" fill="#0f766e"/>
    <text x="32" y="58" fill="#d7f4ef" font-family="Arial, sans-serif" font-size="18" font-weight="700">Overall score</text>
    <text x="32" y="138" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="82" font-weight="700">44</text>
    <text x="145" y="138" fill="#d7f4ef" font-family="Arial, sans-serif" font-size="28" font-weight="700">/100</text>
    <rect x="32" y="171" width="174" height="12" rx="6" fill="#d7f4ef" opacity="0.35"/>
    <rect x="32" y="171" width="76" height="12" rx="6" fill="#ffffff"/>
    <text x="32" y="216" fill="#ffffff" font-family="Arial, sans-serif" font-size="17">Not handoff-ready yet</text>
  </g>

  <g transform="translate(394 250)">
    <rect width="312" height="244" rx="24" fill="#fffdf8" stroke="#d8cdb9"/>
    <text x="24" y="42" fill="#17202a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Top risks</text>
    <g transform="translate(24 72)">
      <rect width="264" height="36" rx="18" fill="#fee2e2"/>
      <text x="16" y="24" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15" font-weight="700">LC001 out-of-order notebook</text>
    </g>
    <g transform="translate(24 122)">
      <rect width="264" height="36" rx="18" fill="#fee2e2"/>
      <text x="16" y="24" fill="#b91c1c" font-family="Arial, sans-serif" font-size="15" font-weight="700">LC005 missing input artifact</text>
    </g>
    <g transform="translate(24 172)">
      <rect width="264" height="36" rx="18" fill="#fef3c7"/>
      <text x="16" y="24" fill="#a16207" font-family="Arial, sans-serif" font-size="15" font-weight="700">LC008 README drift</text>
    </g>
  </g>

  <g transform="translate(738 250)">
    <rect width="326" height="244" rx="24" fill="#fffdf8" stroke="#d8cdb9"/>
    <text x="24" y="42" fill="#17202a" font-family="Arial, sans-serif" font-size="20" font-weight="700">Category scores</text>
    <g font-family="Arial, sans-serif" font-size="15" fill="#5b6470">
      <text x="24" y="82">Environment rebuildability</text>
      <rect x="24" y="96" width="230" height="10" rx="5" fill="#efe7d7"/><rect x="24" y="96" width="152" height="10" rx="5" fill="#0f766e"/>
      <text x="270" y="106" fill="#17202a" font-weight="700">66</text>
      <text x="24" y="132">Notebook determinism</text>
      <rect x="24" y="146" width="230" height="10" rx="5" fill="#efe7d7"/><rect x="24" y="146" width="10" height="10" rx="5" fill="#b91c1c"/>
      <text x="270" y="156" fill="#17202a" font-weight="700">3</text>
      <text x="24" y="182">Artifact availability</text>
      <rect x="24" y="196" width="230" height="10" rx="5" fill="#efe7d7"/><rect x="24" y="196" width="170" height="10" rx="5" fill="#0f766e"/>
      <text x="270" y="206" fill="#17202a" font-weight="700">74</text>
    </g>
  </g>

  <g transform="translate(112 530)">
    <text x="0" y="0" fill="#17202a" font-family="Arial, sans-serif" font-size="20" font-weight="700">First fixes:</text>
    <text x="112" y="0" fill="#5b6470" font-family="Arial, sans-serif" font-size="18">Restart and run all cells, commit missing inputs, update stale setup commands.</text>
    <text x="0" y="42" fill="#0f766e" font-family="Consolas, monospace" font-size="18">labcheck scorecard examples/broken-repo</text>
  </g>
</svg>
