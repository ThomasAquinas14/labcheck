[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "labcheck"
version = "0.1.0"
description = "A reproducibility auditor for research and ML repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Thomas Aquinas" }
]
keywords = ["reproducibility", "notebooks", "machine-learning", "research", "ci"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
  "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.urls]
Homepage = "https://github.com/ThomasAquinas14/labcheck"
Issues = "https://github.com/ThomasAquinas14/labcheck/issues"
Documentation = "https://github.com/ThomasAquinas14/labcheck#readme"

[project.scripts]
labcheck = "labcheck.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
